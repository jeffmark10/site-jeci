<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo | Jeci Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--cream); padding: 30px 0; min-height: 100vh; }
  .admin-wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  
  .auth-overlay {
    position: fixed; inset: 0; background: var(--cream);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .auth-card {
    background: var(--paper); border-radius: 20px; padding: 36px 28px;
    max-width: 400px; width: 100%; box-shadow: var(--shadow-soft);
    border: 1px solid rgba(226,78,138,0.18); text-align: center;
  }
  .auth-error { color: #dc3545; font-size: 0.85rem; font-weight: 700; margin-top: 10px; display: none; }

  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .admin-card { background: var(--paper); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-tag); margin-bottom: 24px; border: 1px solid rgba(226,78,138,0.12); }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: span 2; }
  label { font-weight: 700; font-size: 0.85rem; color: var(--ink); }
  input, select, textarea { font-family: inherit; font-size: 0.95rem; padding: 10px 14px; border: 1.5px solid rgba(46,49,66,0.15); border-radius: 8px; outline: none; }
  
  .size-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .size-chip {
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid rgba(46,49,66,0.2);
    font-size: 0.85rem; font-weight: 700; cursor: pointer; user-select: none;
  }
  .size-chip.selected { background: var(--pink-deep); border-color: var(--pink-deep); color: #fff; }

  .image-upload-box {
    display: flex; gap: 16px; align-items: center; border: 1.5px dashed rgba(226,78,138,0.4);
    padding: 14px; border-radius: 10px; background: var(--cream);
  }
  .image-preview-slot {
    width: 80px; height: 80px; border-radius: 8px; background: #fff;
    border: 1px solid rgba(46,49,66,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .image-preview-slot img { width: 100%; height: 100%; object-fit: cover; }
  .image-inputs { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }

  .table-responsive { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 14px; }
  th, td { padding: 12px; border-bottom: 1px solid rgba(46,49,66,0.08); font-size: 0.9rem; vertical-align: middle; }
  th { background: var(--pink-light); color: var(--pink-deep); }
  
  .status-btn {
    padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; border: none;
  }
  .status-btn.active { background: #d4edda; color: #155724; }
  .status-btn.inactive { background: #f8d7da; color: #721c24; }
  .preview-thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; }
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <span class="brand-script" style="font-size: 2.5rem; color: var(--pink-deep); display: block; margin-bottom: 8px;">Js</span>
    <h2>Painel da Loja</h2>
    <p>Digite a senha administrativa:</p>
    <form id="authForm">
      <input type="password" id="adminPass" placeholder="••••••••" required style="width: 100%; margin-bottom: 14px; padding: 10px;">
      <button type="submit" class="btn btn-whatsapp btn-block">Entrar</button>
      <p class="auth-error" id="authError">Senha incorreta.</p>
    </form>
  </div>
</div>

<div class="admin-wrap" id="adminContent" style="display: none;">
  <div class="admin-header">
    <div>
      <h1>Gerenciador de Calçados</h1>
      <p>Catálogo & Avaliações da Jeci Store</p>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="index.html" class="btn btn-outline btn-sm">← Loja</a>
      <button id="btnExport" class="btn btn-whatsapp btn-sm">📥 Baixar produtos.json</button>
      <button id="btnLogout" class="btn btn-ghost btn-sm">Sair 🚪</button>
    </div>
  </div>

  <div class="admin-card">
    <h2 id="formTitle">Novo Calçado</h2>
    <form id="productForm">
      <input type="hidden" id="prodId">
      
      <div class="form-grid">
        <div class="form-group">
          <label for="categoria">Categoria de Calçado *</label>
          <select id="categoria" required>
            <option value="Sandálias">Sandálias</option>
            <option value="Rasteiras">Rasteiras</option>
            <option value="Papetes">Papetes</option>
            <option value="Saltos">Saltos & Blocos</option>
            <option value="Sapatilhas">Sapatilhas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="codigo">Código SKU *</label>
          <input type="text" id="codigo" placeholder="ex: SAN-001, RAS-001..." required>
        </div>

        <div class="form-group">
          <label for="nome">Nome do Modelo *</label>
          <input type="text" id="nome" placeholder="ex: Sandália Rasteira Cristal" required>
        </div>

        <div class="form-group">
          <label for="preco">Preço (R$) *</label>
          <input type="number" id="preco" step="0.01" placeholder="89.90" required>
        </div>

        <div class="form-group full">
          <label>Numerações Disponíveis</label>
          <div class="size-chips" id="sizeChipsContainer">
            <span class="size-chip selected">34</span>
            <span class="size-chip selected">35</span>
            <span class="size-chip selected">36</span>
            <span class="size-chip selected">37</span>
            <span class="size-chip selected">38</span>
            <span class="size-chip selected">39</span>
            <span class="size-chip">40</span>
          </div>
        </div>

        <div class="form-group full">
          <label>Foto do Calçado</label>
          <div class="image-upload-box">
            <div class="image-preview-slot" id="previewContainer">Sem Foto</div>
            <div class="image-inputs">
              <input type="file" id="imgFile" accept="image/*">
              <input type="text" id="imgUrl" placeholder="Ou cole a URL direta da imagem">
            </div>
          </div>
        </div>

        <div class="form-group full">
          <label for="descricao">Descrição (Palmilha, solado, fivela...)</label>
          <textarea id="descricao" rows="2" placeholder="Detalhes de conforto, solado antiderrapante..."></textarea>
        </div>

        <div class="form-group full" style="display:flex; gap:24px;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="destaque" checked> Exibir nos Destaques
          </label>
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="ativo" checked> Calçado Disponível
          </label>
        </div>
      </div>

      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button type="submit" class="btn btn-whatsapp" id="btnSave">Salvar Calçado</button>
        <button type="button" class="btn btn-outline" id="btnCancel" style="display:none;">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="admin-card">
    <h2>Calçados Cadastrados</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Foto</th>
            <th>Código</th>
            <th>Modelo</th>
            <th>Preço</th>
            <th>Nota</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function() {
  const ADMIN_PASSWORD = "jeci2026";
  let products = [];
  let currentImageData = "";

  const SIZES = ["34", "35", "36", "37", "38", "39", "40"];

  function checkSession() {
    if (sessionStorage.getItem("jeci_auth") === "true") {
      document.getElementById("authOverlay").style.display = "none";
      document.getElementById("adminContent").style.display = "block";
      initCatalog();
    }
  }

  document.getElementById("authForm").addEventListener("submit", function(e) {
    e.preventDefault();
    if (document.getElementById("adminPass").value.trim() === ADMIN_PASSWORD) {
      sessionStorage.setItem("jeci_auth", "true");
      checkSession();
    } else {
      document.getElementById("authError").style.display = "block";
    }
  });

  document.getElementById("btnLogout").addEventListener("click", () => {
    sessionStorage.removeItem("jeci_auth");
    window.location.reload();
  });

  async function initCatalog() {
    const cached = localStorage.getItem("jeci_produtos");
    if (cached) {
      products = JSON.parse(cached);
    } else {
      const res = await fetch("produtos.json");
      products = await res.json();
    }
    setupSizeChips();
    renderTable();
  }

  function setupSizeChips() {
    document.querySelectorAll(".size-chip").forEach(c => {
      c.addEventListener("click", () => c.classList.toggle("selected"));
    });
  }

  document.getElementById("imgFile").addEventListener("change", function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      currentImageData = e.target.result;
      document.getElementById("previewContainer").innerHTML = `<img src="${currentImageData}">`;
    };
    reader.readAsDataURL(file);
  });

  function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    products.forEach((p, idx) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><img src="${p.imagem}" class="preview-thumb"></td>
        <td><strong>${p.codigo}</strong></td>
        <td>${p.nome}</td>
        <td>R$ ${Number(p.preco).toFixed(2)}</td>
        <td>★ ${p.avaliacao || 5.0} (${p.totalAvaliacoes || 1})</td>
        <td>
          <button class="status-btn ${p.ativo ? 'active' : 'inactive'}" onclick="window.toggleStatus(${idx})">
            ${p.ativo ? '✅ Ativo' : '⏸️ Pausado'}
          </button>
        </td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="window.deleteProduct(${idx})">Excluir</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  window.toggleStatus = function(idx) {
    products[idx].ativo = !products[idx].ativo;
    localStorage.setItem("jeci_produtos", JSON.stringify(products));
    renderTable();
  };

  window.deleteProduct = function(idx) {
    if (confirm("Excluir este calçado?")) {
      products.splice(idx, 1);
      localStorage.setItem("jeci_produtos", JSON.stringify(products));
      renderTable();
    }
  };

  document.getElementById("productForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const sizes = Array.from(document.querySelectorAll(".size-chip.selected")).map(c => c.textContent);
    
    const newProd = {
      id: String(Date.now()),
      codigo: document.getElementById("codigo").value.trim().toUpperCase(),
      categoria: document.getElementById("categoria").value,
      nome: document.getElementById("nome").value.trim(),
      preco: parseFloat(document.getElementById("preco").value),
      descricao: document.getElementById("descricao").value.trim(),
      imagem: currentImageData || document.getElementById("imgUrl").value.trim() || "https://images.unsplash.com/photo-1562273138-f46be4ebdf33?w=500",
      tamanhos: sizes,
      avaliacao: 5.0,
      totalAvaliacoes: 1,
      destaque: document.getElementById("destaque").checked,
      ativo: document.getElementById("ativo").checked
    };

    products.push(newProd);
    localStorage.setItem("jeci_produtos", JSON.stringify(products));
    renderTable();
    this.reset();
    document.getElementById("previewContainer").innerHTML = "Sem Foto";
    currentImageData = "";
    alert("Calçado cadastrado com sucesso!");
  });

  document.getElementById("btnExport").addEventListener("click", function() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products, null, 2));
    const dl = document.createElement("a");
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "produtos.json");
    dl.click();
  });

  checkSession();
})();
</script>
</body>
</html>
